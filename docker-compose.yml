services:
  airburg-emo-plus:
    build: .
    container_name: airburg-emo-plus
    restart: unless-stopped
    # BLE 需要访问主机的蓝牙适配器：使用 host 网络 + privileged。
    # bluepy 通过 DBus 与主机的 bluetoothd 通信，所以要挂载系统 dbus socket。
    network_mode: host
    privileged: true
    volumes:
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
    # 可选：用环境变量覆盖易变配置（见 main.py 中的硬编码，若需要可后续改造成读环境变量）
    environment:
      - BLE_DEVICE_ADDR=20:16:09:10:00:96
      - MQTT_BROKER_HOST=localhost
      - MQTT_BROKER_PORT=1883