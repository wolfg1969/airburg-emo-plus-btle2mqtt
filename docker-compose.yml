services:
  airburg-emo-plus:
    build: .
    container_name: airburg-emo-plus
    restart: unless-stopped
    # BLE 需要访问主机的蓝牙适配器：使用 host 网络 + privileged。
    # bleak 通过 DBus 与主机的 bluetoothd 通信，所以要挂载系统 dbus socket。
    network_mode: host
    privileged: true
    volumes:
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
    # 添加日志轮转配置，限制日志大小保留1天左右的日志量
    logging:
      driver: "json-file"
      options:
        max-size: "10m"   # 每个日志文件最大10MB
        max-file: "3"     # 保留最多3个文件（加上当前文件共4个，约40MB）
    # 从 .env 文件加载环境变量；复制 .env.example 并修改
    env_file:
      - .env